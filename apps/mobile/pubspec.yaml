name: genie
description: "genie — the wishlist app for people who love giving."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Storage & security
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # UI
  google_fonts: ^6.2.1
  pinput: ^5.0.0

  # KYC document capture
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/onboarding/
