include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - android/**

linter:
  rules:
    prefer_single_quotes: true
    avoid_print: true
    sort_child_properties_last: true
    # `strict-casts` / `strict-raw-types` will be turned back on once the Flutter
    # toolchain is available locally to verify against.
