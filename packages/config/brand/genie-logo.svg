<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 40" role="img" aria-label="genie">
  <!-- genie — deep violet #6D28D9 (brand.primary[500] in design-tokens.ts).
       Single flat colour so it can be tinted anywhere. -->
  <g fill="#6D28D9">
    <!-- lamp body -->
    <path d="M4.8 28.8q-0.8-8 8.8-9.6h12.8q9.6 1.6 8.8 9.6q0 5.6-15.2 5.6t-15.2-5.6z"/>
    <!-- spout -->
    <path d="M5.6 24 L0 25.6 L5.6 28 z"/>
    <!-- rising wisp -->
    <path d="M20 18.4q-8-4 0-12q-4-2 0.8-4.8" fill="none" stroke="#6D28D9" stroke-width="3.4" stroke-linecap="round"/>
    <!-- the wish -->
    <path d="M24 4q1.1 1.1 2.6 1.6q-1.5 0.5-2.6 1.6q-1.1-1.1-2.6-1.6q1.5-0.5 2.6-1.6z"/>
  </g>
  <text x="44" y="30" font-family="Quicksand, 'Trebuchet MS', sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5" fill="#6D28D9">genie</text>
</svg>
